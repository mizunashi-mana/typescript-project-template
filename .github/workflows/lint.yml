name: CI Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup-devenv

      - name: Run pre-commit
        run: devenv shell pre-commit run --all-files

      - name: Run tsc
        run: devenv shell npm run lint:tsc
